name: Kervia Desktop macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z à publier'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kervia-desktop-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'kerviaHerve/hermes-agent-desktop' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      KERVIA_DESKTOP_EDITION: '1'
      HERMES_DESKTOP_VARIANT: light
      GITHUB_REPOSITORY: kerviaHerve/hermes-agent-desktop
      CSC_LINK: ${{ secrets.KERVIA_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.KERVIA_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.KERVIA_APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.KERVIA_APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.KERVIA_APPLE_API_KEY_P8 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Vérifier la version et les prérequis de signature
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Version attendue : X.Y.Z' >&2; exit 1; }
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [[ -n "${!name}" ]] || { echo "Secret manquant : $name" >&2; exit 1; }
          done
          if gh release view "kervia-v$VERSION" >/dev/null 2>&1; then
            echo "La version kervia-v$VERSION existe déjà" >&2
            exit 1
          fi
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_Kervia.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_Kervia.p8"
          {
            echo "HERMES_PAYLOAD_VERSION=$VERSION"
            echo "HERMES_PAYLOAD_TAG=v$VERSION"
            echo "HERMES_PYTHON=$(command -v python3)"
            echo "HERMES_HOME=$RUNNER_TEMP/kervia-build-home"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey_Kervia.p8"
          } >> "$GITHUB_ENV"

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier le code Desktop
        run: npm --workspace apps/desktop run typecheck

      - name: Construire le DMG et le ZIP signés
        run: npm --workspace apps/desktop run dist:mac

      - name: Contrôler l'application et le canal de mise à jour
        run: |
          set -euo pipefail
          app="apps/desktop/release/mac-arm64/Hermes Desktop · Kervia Edition.app"
          resources="$app/Contents/Resources"
          dmg="apps/desktop/release/HermesDesktopKerviaEdition-${HERMES_PAYLOAD_VERSION}-mac-arm64.dmg"
          zip="apps/desktop/release/HermesDesktopKerviaEdition-${HERMES_PAYLOAD_VERSION}-mac-arm64.zip"
          [[ "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" == 'ch.kervia.hermes-desktop' ]]
          [[ ! -e "$resources/agent-payload" ]]
          [[ -f "$dmg" && -f "$zip" && -f apps/desktop/release/stable-mac.yml ]]
          grep -Fq 'github.com/kerviaHerve/hermes-agent-desktop/releases/latest/download/' "$resources/app-update.yml"
          grep -Fq "HermesDesktopKerviaEdition-${HERMES_PAYLOAD_VERSION}-mac-arm64.zip" apps/desktop/release/stable-mac.yml
          node -e "const s=require('./apps/desktop/build/install-stamp.json'); if(s.dirty || s.payload!=='light' || s.updateMechanism!=='electron-updater' || s.commit!==process.env.GITHUB_SHA) process.exit(1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          hdiutil verify "$dmg"

      - name: Publier les fichiers de mise à jour
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "kervia-v$VERSION" \
            apps/desktop/release/HermesDesktopKerviaEdition-"$VERSION"-mac-arm64.dmg \
            apps/desktop/release/HermesDesktopKerviaEdition-"$VERSION"-mac-arm64.dmg.blockmap \
            apps/desktop/release/HermesDesktopKerviaEdition-"$VERSION"-mac-arm64.zip \
            apps/desktop/release/HermesDesktopKerviaEdition-"$VERSION"-mac-arm64.zip.blockmap \
            apps/desktop/release/stable-mac.yml \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Hermes Desktop · Kervia Edition $VERSION" \
            --notes 'Client Desktop Kervia pour Hermes Agent. Voir le README pour les améliorations et la compatibilité.' \
            --generate-notes
